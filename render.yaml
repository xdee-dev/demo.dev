services:
  - type: web
    name: rental-management-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rental-postgres
          property: connectionString
      - key: ALLOW_RLS_BYPASS_ROLE
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: SEED_DEMO_PASSWORD
        value: DemoRental2026
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: rental-postgres
    plan: free
    region: singapore
    databaseName: rental_db
    user: rental_app
